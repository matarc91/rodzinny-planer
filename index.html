<!doctype html>
<html lang="pl">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Kluczowe tagi dla urządzeń mobilnych i PWA (iPhone / Android) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Rodzinny Planer</title>
  </head>
  <body class="bg-[#121214] text-[#F3F3F5]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[PWA] Service Worker zarejestrowany:', reg.scope);
              // Wymuś natychmiastowe sprawdzenie czy na serwerze jest nowsza wersja
              reg.update().catch(() => {});

              // Wykrycie nowej wersji w trakcie pobierania
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] Wykryto nową wersję aplikacji, odświeżam...');
                      window.location.reload();
                    }
                  });
                }
              });
            })
            .catch((err) => {
              console.error('[PWA] Błąd rejestracji Service Workera:', err);
            });

          // Gdy nowy Service Worker przejmie kontrolę
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });

          // Nasłuchiwanie bezpośredniej wiadomości o aktualizacji z SW
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'SW_UPDATED' && !refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });

        // Wymuś sprawdzenie czy jest nowa wersja przy każdym powrocie do aplikacji
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            navigator.serviceWorker.getRegistration().then((reg) => {
              if (reg) reg.update().catch(() => {});
            });
          }
        });
      }
    </script>
  </body>
</html>
