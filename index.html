<!doctype html>
<html lang="pl">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Kluczowe tagi dla urządzeń mobilnych i PWA (iPhone / Android) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Rodzinny Planer</title>
  </head>
  <body class="bg-[#121214] text-[#F3F3F5]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        const registerSW = () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[PWA] Service Worker zarejestrowany:', reg.scope);
              reg.update().catch(() => {});
            })
            .catch((err) => {
              console.error('[PWA] Błąd rejestracji Service Workera:', err);
            });
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', registerSW);
        } else {
          registerSW();
        }

        // Tylko jeśli strona MIAŁA już kontroler przed startem (kolejne uruchomienie aplikacji),
        // pozwalamy na przeładowanie po aktualizacji. Na pierwszym starcie hadController = false,
        // więc nie przerywamy startu aplikacji i nie zawieszamy ekranu powitalnego (splash screen) w APK/TWA.
        const hadController = Boolean(navigator.serviceWorker.controller);
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing && hadController) {
            refreshing = true;
            window.location.reload();
          }
        });

        // Wymuś sprawdzenie czy jest nowa wersja przy każdym powrocie do aplikacji
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            navigator.serviceWorker.getRegistration().then((reg) => {
              if (reg) reg.update().catch(() => {});
            });
          }
        });
      }
    </script>
  </body>
</html>
